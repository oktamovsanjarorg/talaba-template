apiVersion: apps/v1
kind: Deployment
metadata:
  name: talaba-bot
  namespace: talaba
  labels:
    app: talaba-bot
    tier: frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: talaba-bot
  template:
    metadata:
      labels:
        app: talaba-bot
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: bot
          image: ghcr.io/oktamovsanjar/talaba-bot:latest
          imagePullPolicy: Always
          command: ["python", "bot/main.py"]
          envFrom:
            - configMapRef:
                name: talaba-global-config
            - secretRef:
                name: talaba-secrets
          ports:
            - containerPort: 8000
              name: metrics
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command: ["python", "-c", "import sys; sys.exit(0)"]
            initialDelaySeconds: 30
            periodSeconds: 60
          readinessProbe:
            exec:
              command: ["python", "-c", "import sys; sys.exit(0)"]
            initialDelaySeconds: 10
            periodSeconds: 30
