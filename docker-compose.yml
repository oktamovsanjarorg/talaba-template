services:
  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: talaba_bot
    restart: unless-stopped
    command: ["python", "bot/main.py"]
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - talaba_network

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: talaba_worker
    restart: unless-stopped
    command: ["celery", "-A", "apps.workers.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - talaba_network

  redis:
    image: redis:7-alpine
    container_name: talaba_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD:-talaba_redis_pass}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-talaba_redis_pass}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - talaba_network

  db:
    image: postgres:16-alpine
    container_name: talaba_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: talaba_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - talaba_network

volumes:
  postgres_data:
  redis_data:

networks:
  talaba_network:
    driver: bridge
